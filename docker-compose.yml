# Docker Compose for AWS EC2 Deployment

version: '3.8'

services:
  # Spring Boot Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=jobportal
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres_password
    depends_on:
      - db

  # React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=jobportal
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
